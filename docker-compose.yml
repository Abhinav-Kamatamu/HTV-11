services:
  db:
    # -ha ships timescaledb_toolkit (stats_agg, heartbeat_agg); the plain image does not.
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: undertow
    ports: ["5432:5432"]
    # -ha keeps its data under /home/postgres/pgdata, not /var/lib/postgresql/data
    volumes: [dbdata:/home/postgres/pgdata/data]
volumes:
  dbdata:
