<!doctype html><meta charset="utf-8">
<body style="margin:0;background:#06151a;width:1500px;height:1000px;position:relative;overflow:hidden">
<canvas id="c" width="1500" height="1000" style="position:absolute;inset:0"></canvas>
<div style="position:absolute;left:90px;bottom:118px;font:700 124px 'Helvetica Neue',Arial,sans-serif;color:#f3eee4;letter-spacing:-4px;text-shadow:0 4px 30px rgba(0,0,0,.55)">Ripple</div>
<div style="position:absolute;left:96px;bottom:62px;font:400 36px 'Helvetica Neue',Arial,sans-serif;color:#f3eee4;opacity:.85;letter-spacing:.5px;text-shadow:0 2px 14px rgba(0,0,0,.6)">Small signals, caught early.</div>
<script>
const c=document.getElementById('c');const gl=c.getContext('webgl');
const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const fs=`precision highp float;uniform vec2 R;
const vec3 SC=vec3(0.,1.45,0.);const float SR=0.26;
float hgt(vec2 p){float r=length(p);
  float A=exp(-0.55*r)*smoothstep(0.0,0.35,r)*(1.0-smoothstep(5.0,8.5,r));
  return A*0.085*sin(r*9.0-1.2)+0.5*A*0.03*sin(r*17.0);}
vec3 env(vec3 d){
  float t=clamp(d.y*0.5+0.5,0.,1.);
  vec3 hor=vec3(0.1,0.22,0.25),top=vec3(0.015,0.06,0.08);
  vec3 c=mix(hor,top,pow(clamp(d.y,0.,1.),0.45));
  vec3 L=normalize(vec3(-0.45,0.55,0.35));
  c+=vec3(1.0,0.78,0.5)*pow(max(dot(d,L),0.),180.)*2.2;
  c+=vec3(1.0,0.78,0.5)*pow(max(dot(d,L),0.),12.)*0.12;
  return c;}
float sph(vec3 ro,vec3 rd){vec3 oc=ro-SC;float b=dot(oc,rd),c=dot(oc,oc)-SR*SR,h=b*b-c;if(h<0.)return -1.;return -b-sqrt(h);}
vec3 sphShade(vec3 ro,vec3 rd,float t){
  vec3 p=ro+rd*t;vec3 n=normalize(p-SC);
  float F=0.06+0.94*pow(1.0-max(dot(n,-rd),0.),3.);
  vec3 rf=reflect(rd,n);
  // reflected water + env
  vec3 refl=env(rf);
  if(rf.y<0.){float tw=-p.y/rf.y;vec2 q=(p+rf*tw).xz;refl=mix(vec3(0.03,0.14,0.17),vec3(0.14,0.3,0.33),0.4)+vec3(0.04)*sin(length(q)*9.0);}
  vec3 rr=refract(rd,n,1.0/1.33);
  float down=clamp(-rr.y*0.5+0.5,0.,1.);
  vec3 inner=mix(vec3(0.1,0.3,0.32),vec3(1.0,0.7,0.28),0.45+0.55*down)*(0.85+1.1*pow(1.0-abs(dot(n,-rd)),0.8));
  inner+=vec3(1.0,0.8,0.4)*exp(-8.0*length(n.xz-vec2(0.,0.)+vec2(0.,0.35)))*0.5;
  inner+=vec3(1.0,0.85,0.6)*pow(max(dot(normalize(vec3(0.,-1.,0.)+n*0.2),-rd),0.),6.)*0.25;
  vec3 col=mix(inner,refl,F);
  vec3 L=normalize(vec3(-0.45,0.55,0.35));
  col+=vec3(1.)*pow(max(dot(reflect(-L,n),-rd),0.),90.)*1.6;
  col+=vec3(0.7,0.9,1.)*pow(max(dot(reflect(-normalize(vec3(0.6,0.3,0.4)),n),-rd),0.),60.)*0.5;
  return col;}
void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*R)/R.y;
  vec3 ro=vec3(0.,1.7,5.6);vec3 ta=vec3(0.,0.85,0.);
  vec3 f=normalize(ta-ro),r=normalize(cross(f,vec3(0.,1.,0.))),u=cross(r,f);
  vec3 rd=normalize(f*1.9+r*uv.x+u*uv.y);
  vec3 col;
  float ts=sph(ro,rd);
  float tw=rd.y<0.?-ro.y/rd.y:1e9;
  if(ts>0.&&ts<tw){col=sphShade(ro,rd,ts);}
  else if(rd.y<0.){
    vec3 p=ro+rd*tw;
    float e=0.01;
    float h=hgt(p.xz);
    vec3 n=normalize(vec3(-(hgt(p.xz+vec2(e,0.))-h)/e*1.0,1.,-(hgt(p.xz+vec2(0.,e))-h)/e*1.0));
    float F=0.02+0.98*pow(1.0-max(dot(n,-rd),0.),5.);
    vec3 rf=reflect(rd,n);
    vec3 refl=env(rf);
    float tr=sph(p,rf);
    if(tr>0.){vec3 hp=p+rf*tr;vec3 nn=normalize(hp-SC);float k=0.4+0.6*clamp(-nn.y*0.5+0.5,0.,1.);refl=mix(refl,vec3(1.0,0.66,0.26)*k,0.9);}
    float depth=clamp(length(p.xz)/9.,0.,1.);
    vec3 base=mix(vec3(0.03,0.17,0.2),vec3(0.015,0.075,0.095),depth);
    base+=vec3(0.05,0.12,0.12)*smoothstep(0.,0.1,h*6.0)*0.8; // crest scatter
    col=mix(base,refl,clamp(F*1.15,0.,1.));
    // warm glow under droplet on water
    col+=vec3(0.9,0.5,0.15)*0.22*exp(-dot(p.xz,p.xz)*1.3);
    float fog=smoothstep(6.,40.,length(p.xz));
    col=mix(col,env(vec3(0.,0.02,-1.)),fog);
  } else {col=env(rd)*0.9;}
  // vignette
  float v=length(uv*vec2(0.9,1.1));col*=1.0-0.55*smoothstep(0.35,1.0,v);
  col=pow(col,vec3(0.92));
  gl_FragColor=vec4(col,1.);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))document.title='ERR '+gl.getShaderInfoLog(o);return o;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
gl.uniform2f(gl.getUniformLocation(pr,'R'),1500,1000);gl.viewport(0,0,1500,1000);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
</script>
