<!doctype html><meta charset="utf-8">
<body style="margin:0;background:#dfe8ee;width:1500px;height:1000px;position:relative;overflow:hidden">
<canvas id="c" width="1500" height="1000" style="position:absolute;inset:0"></canvas>
<div style="position:absolute;left:90px;top:56px;font:700 124px 'Helvetica Neue',Arial,sans-serif;color:#10242f;letter-spacing:-4px">Ripple</div>
<div style="position:absolute;left:96px;top:212px;font:400 36px 'Helvetica Neue',Arial,sans-serif;color:#10242f;opacity:.7;letter-spacing:.5px">Small signals, caught early.</div>
<script>
const c=document.getElementById('c');const gl=c.getContext('webgl');
const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const fs=`precision highp float;uniform vec2 R;
const vec3 SC=vec3(0.,1.45,0.);const float SR=0.26;
const vec3 L=vec3(-0.35,0.6,0.45);
float hgt(vec2 p){float r=length(p);
  float A=exp(-0.5*r)*smoothstep(0.0,0.35,r)*(1.0-smoothstep(5.0,8.5,r));
  return A*0.075*sin(r*9.0-1.2)+0.5*A*0.025*sin(r*17.0);}
vec3 env(vec3 d){
  vec3 hor=vec3(0.86,0.91,0.94),top=vec3(0.52,0.67,0.78);
  vec3 c=mix(hor,top,smoothstep(0.0,0.75,d.y));
  c+=vec3(1.)*pow(max(dot(d,normalize(L)),0.),220.)*1.5;
  return c;}
float sph(vec3 ro,vec3 rd){vec3 oc=ro-SC;float b=dot(oc,rd),c=dot(oc,oc)-SR*SR,h=b*b-c;if(h<0.)return -1.;return -b-sqrt(h);}
vec3 waterCol(vec2 q,float h){
  float depth=clamp(length(q)/9.,0.,1.);
  return mix(vec3(0.16,0.36,0.46),vec3(0.28,0.5,0.6),depth)+vec3(0.05,0.08,0.08)*h*8.0;}
vec3 sphShade(vec3 ro,vec3 rd,float t){
  vec3 p=ro+rd*t;vec3 n=normalize(p-SC);
  float F=0.04+0.96*pow(1.0-max(dot(n,-rd),0.),4.);
  vec3 rf=reflect(rd,n);
  vec3 refl=env(rf);
  if(rf.y<0.){float tw=-p.y/rf.y;vec2 q=(p+rf*tw).xz;refl=waterCol(q,hgt(q))*1.05;}
  // refraction: a droplet flips the world, so look through it at the sky/water inverted
  vec3 rr=refract(rd,n,1.0/1.33);
  vec3 inv=normalize(vec3(rr.x,-rr.y*0.9-0.15,rr.z));
  vec3 thru=mix(waterCol(inv.xz*3.,0.)*1.1,env(inv)*0.85,smoothstep(-0.7,0.7,inv.y));
  float rim=pow(1.0-abs(dot(n,-rd)),2.2);
  vec3 col=mix(thru*(0.8+0.3*rim),refl,F)+vec3(0.04,0.08,0.1)*rim;
  col=mix(col,vec3(0.08,0.2,0.28),0.18*rim);
  col+=vec3(1.)*pow(max(dot(reflect(-normalize(L),n),-rd),0.),110.)*1.8;
  col+=vec3(1.)*pow(max(dot(reflect(-normalize(vec3(0.7,0.4,0.3)),n),-rd),0.),50.)*0.35;
  return col;}
void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*R)/R.y;
  vec3 ro=vec3(0.,1.7,5.6);vec3 ta=vec3(0.,0.85,0.);
  vec3 f=normalize(ta-ro),r=normalize(cross(f,vec3(0.,1.,0.))),u=cross(r,f);
  vec3 rd=normalize(f*1.9+r*uv.x+u*uv.y);
  vec3 col;
  float ts=sph(ro,rd);
  float tw=rd.y<0.?-ro.y/rd.y:1e9;
  if(ts>0.&&ts<tw){col=sphShade(ro,rd,ts);}
  else if(rd.y<0.){
    vec3 p=ro+rd*tw;
    float e=0.01;
    float h=hgt(p.xz);
    vec3 n=normalize(vec3(-(hgt(p.xz+vec2(e,0.))-h)/e,1.,-(hgt(p.xz+vec2(0.,e))-h)/e));
    float F=0.02+0.98*pow(1.0-max(dot(n,-rd),0.),5.);
    vec3 rf=reflect(rd,n);
    vec3 refl=env(rf);
    float tr=sph(p,rf);
    if(tr>0.){vec3 hp=p+rf*tr;vec3 nn=normalize(hp-SC);refl=mix(refl,vec3(0.55,0.72,0.82),0.6)*(0.7+0.3*nn.y);}
    col=mix(waterCol(p.xz,h),refl,clamp(F*1.1,0.,1.));
    float fog=smoothstep(6.,40.,length(p.xz));
    col=mix(col,vec3(0.86,0.91,0.94),fog);
  } else {col=env(rd);}
  float v=length(uv*vec2(0.85,1.05));col*=1.0-0.18*smoothstep(0.4,1.0,v);
  gl_FragColor=vec4(col,1.);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))document.title='ERR '+gl.getShaderInfoLog(o);return o;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
gl.uniform2f(gl.getUniformLocation(pr,'R'),1500,1000);gl.viewport(0,0,1500,1000);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
</script>
